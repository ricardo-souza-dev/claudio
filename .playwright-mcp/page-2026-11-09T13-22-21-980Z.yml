            - generic [ref=f2e379]:
              - heading [level=3] [ref=f2e380]:
                - button "Which Linux distributions does Claude Desktop support?" [ref=f2e381] [cursor=pointer]
              - generic:
                - paragraph: Claude Desktop for Linux is in beta and supports Ubuntu and Debian (x64 and arm64). Support for additional distributions is coming in the future.
            - generic [ref=f2e386]:
              - heading [level=3] [ref=f2e387]:
                - button "Which plans include Claude Desktop for Linux?" [ref=f2e388] [cursor=pointer]
              - generic:
                - paragraph: Chat is available on all plans, including Free. Claude Code and Claude Cowork are available on Pro, Max, Ultra, Team, and Enterprise.
            - generic [ref=f2e393]:
              - heading [level=3] [ref=f2e394]:
                - button "Are all features available on Linux?" [ref=f2e395] [cursor=pointer]
              - generic:
                - paragraph: Most are. Claude Code, Claude Cowork, and Chat are all available at launch. Computer Use is not yet available on Linux, and is coming soon. Dictation is also not available in this release. The Quick Entry global hotkey works on X11; on native Wayland it requires the desktop's GlobalShortcuts portal.
