          - generic [ref=f2e322]:
            - generic [ref=f2e323]:
              - heading [level=3] [ref=f2e324]:
                - button "Do I need a paid plan to use the desktop or mobile apps?" [ref=f2e325] [cursor=pointer]
              - generic:
                - paragraph: "No. Claude apps are available to all plan types: Free, Pro, Max, Ultra, Team, and Enterprise. Some features are only available to paid plans."
            - generic [ref=f2e330]:
              - heading [level=3] [ref=f2e331]:
                - button "What’s the difference between the desktop app and using Claude in my browser?" [ref=f2e332] [cursor=pointer]
              - generic:
                - paragraph: The desktop app is always accessible from your dock and includes quick entry for instant access from anywhere in your system. You also get desktop extensions to connect Claude with your local tools and files.
            - generic [ref=f2e337]:
              - heading [level=3] [ref=f2e338]:
                - button "Can I use the same account across desktop, web, and mobile?" [ref=f2e339] [cursor=pointer]
              - generic:
                - paragraph: Your conversations, projects, memory, and preferences sync across all devices when you’re signed in. In Claude Cowork, local sessions stay on-device.
            - generic [ref=f2e344]:
              - heading [level=3] [ref=f2e345]:
                - button "How do I connect Claude to my tools?" [ref=f2e346] [cursor=pointer]
              - generic:
                - paragraph: Connectors allow Claude to work with tools like your apps and databases. Web-based connectors like Google Drive and Slack work wherever you’re using Claude—web, desktop, or mobile. On mobile, Claude can also connect to device-specific apps like Maps and iMessage. The desktop app also supports desktop extensions, which are locally installed and provide access to your local file systems, browsers, and native applications.
            - generic [ref=f2e351]:
              - heading [level=3] [ref=f2e352]:
                - button "How does Claude Desktop work with the Chrome extension?" [ref=f2e353] [cursor=pointer]
              - generic:
                - paragraph:
                  - text: Claude in Chrome is included as a connector and is ready to use when you enable it. Turn it on in any conversation and Claude can navigate, click, and fill forms in your browser from the Desktop app. Start a task without switching windows. Learn more about
                  - link:
                    - /url: http://claude.com/claude-in-chrome
                    - text: Claude in Chrome
                  - text: .
            - generic [ref=f2e358]:
              - heading [level=3] [ref=f2e359]:
                - button "Can I use Claude Code in the desktop app?" [ref=f2e360] [cursor=pointer]
              - generic:
                - paragraph:
                  - text: Yes. Claude Code runs directly in the desktop app. You can preview running servers, review local code changes, and monitor pull request status without leaving the app. Your work moves with you. Bring a CLI conversation into the desktop app with
                  - code: /desktop
                  - text: ", or continue from the web or your phone."
                  - link:
                    - /url: https://claude.com/product/claude-code
                    - text: Learn more about Claude Code
                    - generic: (opens in new tab)
                  - text: .
            - generic [ref=f2e365]:
              - heading [level=3] [ref=f2e366]:
                - button "How do I bring the desktop app to my organization?" [ref=f2e367] [cursor=pointer]
              - generic:
                - paragraph: Claude desktop app supports standard enterprise deployment with MSIX installers (Windows) and PKG installers (Mac). You can control version updates to test and approve on your timeline, get automatic SSO authentication for managed devices, and pre-approve which desktop extensions your team can access.
            - generic [ref=f2e372]:
              - heading [level=3] [ref=f2e373]:
                - button "Where can I get help or learn more?" [ref=f2e374] [cursor=pointer]
              - generic:
                - paragraph:
